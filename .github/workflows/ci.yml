name: Framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - run: npm ci --prefix console
      - run: .venv/bin/python scripts/check_release.py
      - run: npx playwright install --with-deps chromium
        working-directory: console
      - run: npm run test:e2e --prefix console
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-traces
          path: console/test-results/
          retention-days: 7
  postgres-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eivon
          POSTGRES_USER: eivon
          POSTGRES_PASSWORD: eivon-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eivon -d eivon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[postgres]'
      - name: Initialize PostgreSQL schema
        env:
          EIVON_DATA_DIR: /tmp/eivon-postgres
          EIVON_DATABASE_URL: postgresql+psycopg://eivon:eivon-ci-password@127.0.0.1:5432/eivon
        run: .venv/bin/eivon migrate
      - name: Rehearse pg_dump and pg_restore
        env:
          EIVON_DATA_DIR: /tmp/eivon-postgres
          EIVON_DATABASE_URL: postgresql+psycopg://eivon:eivon-ci-password@127.0.0.1:5432/eivon
        run: .venv/bin/python scripts/postgres_restore_rehearsal.py
