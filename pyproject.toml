[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "eivon"
version = "0.1.0"
description = "A self-hosted, domain-independent agent runtime and management console"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1", "cryptography>=44,<50", "jsonschema>=4.23,<5",
  "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
eivon = "eivon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eivon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
